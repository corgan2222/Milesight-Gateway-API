name: Test

on: [push, pull_request]

jobs:
  test:
    # ubuntu-latest (26.04) no longer offers Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest Python that setup.py's python_requires covers.
        python-version: ["3.9", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . -r requirements_test.txt
    - name: Install the decoder and LoRaWAN extras
      # lorawan-connection needs Python 3.12; on 3.9 those tests skip.
      if: matrix.python-version != '3.9'
      run: pip install -e ".[decoder]" "lorawan-connection==1.3.0"
    - name: Run the offline tests
      run: pytest
