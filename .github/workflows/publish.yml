---
name: Publish

# Publishes to PyPI from a public CI pipeline, which is what the Home Assistant
# quality scale rule "dependency-transparency" asks of a dependency. Uses PyPI
# Trusted Publishing, so no API token is stored in this repository.
#
# One-time setup on PyPI, under the project's Publishing settings:
#   Owner:            corgan2222
#   Repository:       Milesight-Gateway-API
#   Workflow name:    publish.yml
#   Environment name: pypi

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python3 -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python3 -m build

      - name: Upload the distribution for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Kept separate from the build job so that only this job, which runs no
    # project code, holds the token-minting permission.
    environment:
      name: pypi
      url: https://pypi.org/p/Milesight-Gateway-API
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download the built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
