name: Pylint

on: [push, pull_request]

jobs:
  pylint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      # The LoRaWAN connection needs Python 3.12; one run covers every module.
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install the package with its extras
      # Pylint resolves imports, so it needs what the code imports.
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[decoder]" "lorawan-connection==1.3.0" -r requirements_test.txt
        pip install pylint python-dotenv setuptools
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py' ':!:examples/*')
    - name: Analysing the examples with pylint
      # Each example stands alone, so they share their setup on purpose.
      run: |
        pylint --disable=duplicate-code $(git ls-files 'examples/*.py')
